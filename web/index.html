<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dynamic Array Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="brand">
            <h1>Dynamic Array Manager</h1>
            <p>Memory management dashboard</p>
        </div>

        <div class="server-status">
            <span class="status-indicator"></span>
            <span>Server online</span>
        </div>
    </header>

    <main class="container">

        <section class="overview">
            <div class="overview-card">
                <span class="overview-label">Total Groups</span>
                <h2 id="total-groups">10</h2>
            </div>

            <div class="overview-card">
                <span class="overview-label">Occupied Slots</span>
                <h2 id="occupied-slots">0</h2>
            </div>

            <div class="overview-card">
                <span class="overview-label">Available Slots</span>
                <h2 id="available-slots">1000</h2>
            </div>
        </section>

        <section class="create-section">

            <h2>Create a new array</h2>

            <form id="create-array-form">

                <label for="array-size">Array size</label>

                <input
                    type="number"
                    id="array-size"
                    name="size"
                    min="1"
                    max="10000"
                    required
                >
                <button type="submit">Create array</button>

            </form>

        </section>

        <section class="groups-section">

            <div class="section-header">
                <div>
                    <h2>Memory Groups</h2>
                    <button onclick="window.location.href='manage.html'">
                        Manage Arrays
                    </button>
                    <p>Manage your allocated arrays</p>
                </div>
            </div>

            <div class="groups-grid" id="groups-container">
            </div>

        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
